# Publica o guia do dia: nos dias 1 e 15 reconstrói o site na Vercel, que só
# gera os guias cuja data já chegou. O Deploy Hook fica no segredo
# VERCEL_DEPLOY_HOOK do repositório (Settings, Secrets and variables, Actions).
name: Publicar guias

on:
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Reconstruir o site na Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          test -n "$HOOK" || { echo "Falta o segredo VERCEL_DEPLOY_HOOK"; exit 1; }
          curl -fsS -X POST "$HOOK"
